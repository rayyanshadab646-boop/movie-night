<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Movie Night</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b0b0e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Home Screen Styling */
        #home-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        p {
            color: #949ba4;
            font-size: 1.1rem;
            margin: 0;
        }

        .start-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
        }

        .start-btn:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Player Screen Styling (Hidden by default) */
        #player-screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 90%;
            height: 90%;
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <!-- Home Screen UI -->
    <div id="home-screen">
        <h1>🎬 Server Movie Night</h1>
        <p>Grab your snacks. Click below to launch the stream for everyone.</p>
        <button class="start-btn" onclick="startMovie()">Start Movie</button>
    </div>

    <!-- Movie Player UI -->
    <div id="player-screen">
        <iframe id="movie-iframe" src="" allow="autoplay" allowfullscreen></iframe>
    </div>

    <script>
        function startMovie() {
            // Hide the home screen overlay
            document.getElementById('home-screen').style.display = 'none';
            
            // Show the player container
            document.getElementById('player-screen').style.display = 'flex';
            
            // Inject the Google Drive preview link so it loads instantly upon clicking Start
            document.getElementById('movie-iframe').src = "https://drive.google.com/file/d/1H-7qpOSRf6jMJp5xw2U8vypc1ey-OYI3/preview";
        }
    </script>
</body>
</html>
